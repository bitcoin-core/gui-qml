name: Build and Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  linux:
    name: ${{ matrix.job_name }}
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: 'Ubuntu 22.04, Qt 6.2'
            image: ubuntu-22.04
            # Jammy's default GCC 11 is below Bitcoin Core's GCC 12.1 minimum.
            extra_packages: 'g++-12'
            cmake_options: '-DCMAKE_CXX_COMPILER=g++-12'
          - job_name: 'Ubuntu 24.04, Qt 6.4'
            image: ubuntu-24.04
          - job_name: 'Ubuntu 26.04, Qt 6.10'
            image: ubuntu-26.04

    env:
      BUILD_APP_TESTS: ON
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libsqlite3-dev \
            zlib1g-dev \
            libboost-all-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            qt6-l10n-tools \
            qt6-tools-dev-tools \
            qt6-declarative-dev \
            qml6-module-qt-labs-platform \
            qt6-declarative-private-dev \
            qml6-module-qt-labs-settings \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtqml \
            qml6-module-qtqml-workerscript \
            libgl-dev \
            libqrencode-dev \
            ${{ matrix.extra_packages }}

      - name: Configure (CMake)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_APP_TESTS=${{ env.BUILD_APP_TESTS }} \
            -DENABLE_IPC=OFF \
            ${{ matrix.cmake_options }}

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        if: env.BUILD_APP_TESTS == 'ON'
        run: ctest --test-dir build --output-on-failure
